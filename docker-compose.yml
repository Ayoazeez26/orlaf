services:
  postgres:
    image: postgres:16-alpine
    container_name: orlaf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orlaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orlaf_secret}
      POSTGRES_DB: ${POSTGRES_DB:-orlaf_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - orlaf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orlaf} -d ${POSTGRES_DB:-orlaf_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  orlaf_postgres_data:
    driver: local